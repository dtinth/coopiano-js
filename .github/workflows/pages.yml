name: Build and deploy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: "24"
          run-install: false
      - run: vp install
      - uses: jdx/mise-action@v5
      - run: ./wasm/build.sh
      - run: vp check
      - run: vp build
      - run: node scripts/render.ts render.wav
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
